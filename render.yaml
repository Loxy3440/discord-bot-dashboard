services:
  - type: web
    name: discord-bot-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: ALLOWED_GUILD_ID
        sync: false
